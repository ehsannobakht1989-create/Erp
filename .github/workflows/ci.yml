name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none

      - name: Check repository budget
        run: bash tools/budget.sh

      - name: Prevent unverified completion claims
        run: |
          python3 -m unittest discover -s tools/tests -p "test_*.py"
          python3 tools/status_guard.py

      - name: Test incomplete depth diagnostics (fail closed)
        run: |
          php tools/tests/depth-inspector.php
          php tools/tests/depth-php-analyzer.php
          python3 -m unittest discover -s tools/tests -p "test_depth_cli.py"
          php tools/depth-check.php --all --gate --write-status
          git diff --exit-code -- docs/depth-status.md

      - name: Test module catalog
        run: php tests/platform/module-catalog.php

      - name: Validate module manifests
        run: php tools/validate-manifests.php

      - name: Check generated event catalog
        run: php tools/event-catalog.php --check

      - name: PHP syntax lint
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -r -n1 php -l

      - name: Run core tests
        run: php tools/test.php

      - name: Build web shell (if present)
        if: hashFiles('web/shell/package.json') != ''
        run: |
          cd web/shell
          npm ci
          npm run typecheck
          npm run test
          npm run build

      - name: Build minimal profile package
        run: |
          php builder/bin/build.php --profile profiles/minimal.yaml
          ls -lh dist/minimal-1.0.0.zip

  laravel-scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, mbstring, pdo_sqlite, xmlwriter, zip
          tools: composer:v2
      - name: Validate and install locked dependencies
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --prefer-dist
      - name: Check Laravel and transition-tool formatting
        run: vendor/bin/pint --test
      - name: Static analysis of Laravel platform and its tests
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M
      - name: Test Laravel scaffold
        run: |
          php artisan --version
          php tests/platform/laravel-smoke.php
          php tests/platform/module-manager.php
          php tests/platform/module-resources.php
          php tests/platform/module-state.php
          php tests/platform/manifest-validation.php
          php tests/platform/tenancy.php
          php tests/platform/tenancy-middleware.php
          php tests/platform/domain-events.php
          php tests/platform/event-catalog.php
          php tests/platform/contracts.php
          php tests/platform/audit.php
          php tests/platform/permissions.php
          php tests/platform/money.php
          php artisan erp:modules:list
          php artisan erp:modules:graph
          php artisan erp:modules:validate
          vendor/bin/phpunit --fail-on-risky --fail-on-warning
