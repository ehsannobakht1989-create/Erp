name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none

      - name: Check repository budget
        run: bash tools/budget.sh

      - name: Test module catalog
        run: php tests/platform/module-catalog.php

      - name: Validate module manifests
        run: php tools/validate-manifests.php

      - name: Architecture rules
        run: php tools/architecture-check.php

      - name: Check generated event catalog
        run: php tools/event-catalog.php --check

      - name: PHP syntax lint
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -r -n1 php -l

      - name: Run core tests
        run: php tools/test.php

      - name: Build web shell (if present)
        if: hashFiles('web/shell/package.json') != ''
        run: |
          cd web/shell
          npm ci
          npm run typecheck
          npm run test
          npm run build

      - name: Build minimal profile package
        run: |
          php builder/bin/build.php --profile profiles/minimal.yaml
          ls -lh dist/minimal-1.0.0.zip

  laravel-scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, mbstring, pdo_sqlite, xmlwriter, zip
          tools: composer:v2
      - name: Validate and install locked dependencies
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --prefer-dist
      - name: Check Laravel and transition-tool formatting
        run: vendor/bin/pint --test
      - name: Static analysis of Laravel platform and its tests
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M
      - name: Test Laravel scaffold
        run: |
          php artisan --version
          php tests/run-platform.php
          php tests/run-platform.php --env=phpunit
          php artisan erp:modules:list
          php artisan erp:modules:graph
          php artisan erp:modules:validate
          vendor/bin/phpunit --fail-on-risky --fail-on-warning

  depth-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, mbstring, pdo_sqlite, xmlwriter, zip
          tools: composer:v2
      - name: Install locked dependencies (module tests run through PHPUnit)
        run: composer install --no-interaction --prefer-dist
      - name: Test the depth gate itself
        run: |
          php tests/platform/depth-gate.php
          php tests/platform/depth-php-analyzer.php
      - name: Depth gate (fails when any module claims more than it passes)
        run: |
          php tools/depth-check.php --all --gate --write-status
          git diff --exit-code -- docs/depth-status.md
