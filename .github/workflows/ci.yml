name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none

      - name: Check repository budget
        run: bash tools/budget.sh

      - name: Prevent unverified completion claims
        run: |
          python3 -m unittest discover -s tools/tests -p "test_*.py"
          python3 tools/status_guard.py

      - name: Test incomplete depth diagnostics (fail closed)
        run: |
          php tools/tests/depth-inspector.php
          python3 -m unittest discover -s tools/tests -p "test_depth_cli.py"
          php tools/depth-check.php --all --gate

      - name: Test module catalog
        run: php tests/platform/module-catalog.php

      - name: Validate module manifests
        run: php tools/validate-manifests.php

      - name: PHP syntax lint
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -r -n1 php -l

      - name: Run core tests
        run: php tools/test.php

      - name: Build web shell (if present)
        if: hashFiles('web/shell/package.json') != ''
        run: |
          cd web/shell
          npm ci
          npm run typecheck
          npm run test
          npm run build

      - name: Build minimal profile package
        run: |
          php builder/bin/build.php --profile profiles/minimal.yaml
          ls -lh dist/minimal-1.0.0.zip
